<div class="disk-row">
  <input name="data_disk_gb" type="number" min="{{ catalog.data_disk_min }}" max="{{ catalog.data_disk_max }}"
         value="{{ size }}" placeholder="GB" aria-label="Data disk size in GB">
  <button type="button" class="link" onclick="this.closest('.disk-row').remove()">Remove</button>
</div>
