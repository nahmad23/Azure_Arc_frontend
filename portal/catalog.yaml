# Choices offered by the provisioning form. Edit to match your environment.
# Each `id` is what the pipeline receives in requestJson; map it to your
# Terraform variables (template name, cluster, port group / VM network, etc.).

departments:
  - {id: infrastructure, label: Infrastructure}
  - {id: application, label: Application}
  - {id: database, label: Database}
  - {id: security, label: Security}
  - {id: network, label: Network}

environments:
  - {id: prod,    label: Production}
  - {id: preprod, label: Pre-Prod}
  - {id: test,    label: Test}
  - {id: dev,     label: Dev}

request_types:
  - {id: new,     label: New Server}
  - {id: rebuild, label: Rebuild}
  - {id: clone,   label: Clone}

# Infrastructure platforms (each has its own Terraform directory).
# `images` maps an operating system id (below) to the template on that platform.
platforms:
  vmware:
    label: VMware vSphere
    images:
      rhel9: tpl-rhel9
      ubuntu2404: tpl-ubuntu2404
      win2022: tpl-win2022
  scvmm:
    label: Microsoft Hyper-V (SCVMM)
    images:
      rhel9: vhdx-rhel9
      win2022: vhdx-win2022

operating_systems:
  - {id: rhel9,      label: RHEL 9,              family: linux}
  - {id: ubuntu2404, label: Ubuntu 24.04,        family: linux}
  - {id: win2022,    label: Windows Server 2022, family: windows}

locations:
  - id: us
    label: US
    datacenters:
      - {id: us1, label: US1}
  - id: uk
    label: UK
    datacenters:
      - {id: uk1, label: UK1}
  - id: in
    label: India
    datacenters:
      - {id: in1, label: IN1}

server_roles:
  - {id: application, label: Application}
  - {id: web,         label: Web}
  - {id: database,    label: Database}
  - {id: monitoring,  label: Monitoring}
  - {id: other,       label: Other}

compute:
  cpu: [2, 4, 8, 16]
  custom_cpu: {min: 1, max: 64}      # range for the "Custom" CPU option
  memory_gb: [8, 16, 32, 64]
  os_disk_gb: [80, 100, 150]
  additional_disk_gb: {min: 10, max: 4096}
  disk_types:
    - {id: ssd,      label: SSD}
    - {id: standard, label: Standard}

# Static IPs are checked against the VLAN's subnet.
networks:
  - id: production
    label: Production
    vlans:
      - {id: vlan-110, label: "VLAN-110 (App)",      cidr: 10.192.10.0/24, gateway: 10.192.10.1}
      - {id: vlan-120, label: "VLAN-120 (Database)", cidr: 10.192.20.0/24, gateway: 10.192.20.1}
  - id: nonproduction
    label: Non-Production
    vlans:
      - {id: vlan-210, label: "VLAN-210 (Dev/Test)", cidr: 10.193.10.0/24, gateway: 10.193.10.1}

domains:
  - {id: unitedlex.global, label: unitedlex.global}

ad_groups:
  - {id: GRP_ServerAdmin_Access, label: GRP_ServerAdmin_Access}
  - {id: GRP_Unix_Admins,        label: GRP_Unix_Admins}
  - {id: GRP_Windows_Admins,     label: GRP_Windows_Admins}
  - {id: GRP_App_Support,        label: GRP_App_Support}

# Section 4 checkboxes.
security_options:
  - {id: monitoring,         label: "Monitoring (Zabbix)", default: true}
  - {id: backup,             label: "Backup",              default: true}
  - {id: vulnerability_scan, label: "Vulnerability Scan",  default: true}
  - {id: ansible_hardening,  label: "Ansible Hardening",   default: true}
  - {id: edr_av,             label: "EDR / AV",            default: true}

# Section 5 checkboxes: steps the pipeline should run.
automation_options:
  - {id: terraform_provisioning, label: "Terraform Provisioning",   default: true}
  - {id: ansible_hardening,      label: "Ansible Server Hardening", default: true}
  - {id: domain_join,            label: "Domain Join",              default: true}
  - {id: zabbix_agent,           label: "Zabbix Agent Installation", default: true}
  - {id: monitoring_config,      label: "Monitoring Configuration", default: true}
  - {id: backup_config,          label: "Backup Configuration",     default: true}
  - {id: security_baseline,      label: "Security Baseline",        default: true}
  - {id: patch_config,           label: "Patch Configuration",      default: true}

approvers:
  - {id: unix-lead,    label: "Unix Team Lead"}
  - {id: windows-lead, label: "Windows Team Lead"}
  - {id: infra-mgr,    label: "Infrastructure Manager"}
