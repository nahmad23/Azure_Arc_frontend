---
# Both handlers listen on "Reload nginx" and run in this order. A bad config
# fails the test, so the reload is skipped and the play stops on this node
# (serial: 1); the other node keeps serving and holds the VIP.
- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Reload nginx

- name: Apply nginx reload
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Reload nginx
